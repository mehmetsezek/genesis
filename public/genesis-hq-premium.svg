<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Premium empty Genesis headquarters cutaway">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020504"/><stop offset="1" stop-color="#07110d"/></linearGradient>
  <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#111a17"/><stop offset=".32" stop-color="#3a4641"/><stop offset=".52" stop-color="#101714"/><stop offset=".8" stop-color="#4b5752"/><stop offset="1" stop-color="#151e1a"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f6745"/><stop offset=".45" stop-color="#4d3525"/><stop offset="1" stop-color="#24170f"/></linearGradient>
  <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4e3424"/><stop offset="1" stop-color="#1f1510"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18312e" stop-opacity=".8"/><stop offset=".58" stop-color="#0b1715" stop-opacity=".92"/><stop offset="1" stop-color="#030807" stop-opacity=".98"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b251f"/><stop offset=".45" stop-color="#171512"/><stop offset="1" stop-color="#090b09"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110e"/><stop offset="1" stop-color="#0b1b15"/></linearGradient>
  <linearGradient id="liftGlass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07110f"/><stop offset=".5" stop-color="#1a3d31"/><stop offset="1" stop-color="#07110f"/></linearGradient>
  <radialGradient id="warm"><stop stop-color="#ffd49b" stop-opacity=".42"/><stop offset=".6" stop-color="#dd8d3b" stop-opacity=".09"/><stop offset="1" stop-color="#ffb15a" stop-opacity="0"/></radialGradient>
  <radialGradient id="greenGlow"><stop stop-color="#5dff9f" stop-opacity=".22"/><stop offset="1" stop-color="#31ff85" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".72"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4aa376" stroke-opacity=".045"/></pattern>
  <pattern id="floorTiles" width="70" height="38" patternUnits="userSpaceOnUse"><path d="M0 0H70V38H0Z" fill="none" stroke="#8a735c" stroke-opacity=".09"/><path d="M35 0V38" stroke="#8a735c" stroke-opacity=".04"/></pattern>
</defs>
