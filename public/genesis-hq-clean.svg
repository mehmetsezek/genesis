<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Clean Genesis headquarters architectural cutaway">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020605"/><stop offset="1" stop-color="#07100c"/></linearGradient>
 <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#25312d"/><stop offset=".5" stop-color="#0d1512"/><stop offset="1" stop-color="#34413c"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d412c"/><stop offset="1" stop-color="#251b14"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17302d" stop-opacity=".82"/><stop offset="1" stop-color="#07100e" stop-opacity=".96"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#221c16"/><stop offset="1" stop-color="#0a0c0b"/></linearGradient>
 <radialGradient id="warm"><stop stop-color="#ffd9a0" stop-opacity=".36"/><stop offset="1" stop-color="#ffb25a" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2f5144" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#grid)"/>
